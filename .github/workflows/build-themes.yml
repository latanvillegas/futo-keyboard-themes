name: Build FUTO themes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to update (leave empty for artifacts only)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'requirements.txt'
      - '.github/workflows/build-themes.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build themes
        run: python tools/build_themes.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-themes
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach ZIPs to newly published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber

      - name: Replace ZIPs in existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.zip --clobber
