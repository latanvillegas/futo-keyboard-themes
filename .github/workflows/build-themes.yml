name: Build FUTO themes

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to update (defaults to v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string
  push:
    branches: [main]
    paths:
      - 'tools/build_aurora_glass_26.py'
      - 'tools/build_liquid_prism_26.py'
      - 'tools/build_solar_flare_26.py'
      - 'tools/build_aero_mint_26_dark.py'
      - 'tools/build_obsidian_bloom_26.py'
      - 'tools/build_neon_orchid_studio_26.py'
      - 'requirements.txt'
      - '.github/workflows/build-themes.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build approved themes only
        run: |
          rm -rf dist
          mkdir -p dist
          python tools/build_aurora_glass_26.py
          python tools/build_liquid_prism_26.py
          python tools/build_solar_flare_26.py
          python tools/build_aero_mint_26_dark.py
          python tools/build_obsidian_bloom_26.py
          python tools/build_neon_orchid_studio_26.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: futo-keyboard-themes-approved
          path: dist/*.zip
          if-no-files-found: error
      - name: Sync approved ZIPs to v1.0.0 after changes on main
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v1.0.0" dist/*.zip --clobber
      - name: Attach approved ZIPs to newly published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.zip --clobber
      - name: Manually sync approved ZIPs to an existing release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.release_tag }}" dist/*.zip --clobber
